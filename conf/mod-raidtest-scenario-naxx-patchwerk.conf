# mod-raidtest: naxx-patchwerk 场景（design §4.2 数据驱动场景配置）
# 场景名 = 文件基名去掉 "mod-raidtest-scenario-" 前缀与 ".conf" 后缀（naxx-patchwerk）。
# 全部元数据走配置；Task 7 Orchestrator 从注册表 Get 后按本文件字段组织 attempt。
#
# MapId        : 地图 id（Naxx=533）
# BossEntry    : 目标 boss creature entry（Patchwerk=16028，Task 4 验证）
# RosterFile   : roster 身份配置文件名（与 conf/ 下 mod-raidtest-roster-*.conf 对应）
# GearProfile  : 兜底配装档位 none/epic（蓝图显式装备优先；缺槽走 PlayerbotFactory 兜底）
# EngageX/Y/Z/O: 开战安全点世界坐标 + 朝向（Patchwerk 房间中央，Task 4 实机验证接战成功）
# TimeoutSeconds: 单次 attempt 超时（秒）；0 = 不设超时
# EngageTrigger: 开战方式（当前仅 pull：leader bot 主动拉取，CombatTrigger::PullBoss）

[Scenario]
MapId           = 533
BossEntry       = 16028
RosterFile      = "mod-raidtest-roster-naxx-patchwerk.conf"
GearProfile     = epic
EngageX         = 3256.36
EngageY         = -3230.33
EngageZ         = 294.063
EngageO         = 0.0
TimeoutSeconds  = 300
EngageTrigger   = pull